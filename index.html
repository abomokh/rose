<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>new Rose()</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:manipulation}
canvas{display:block;width:100vw;height:100vh;height:100dvh;image-rendering:pixelated}
#snd{position:fixed;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));font:bold 22px/1 monospace;letter-spacing:2px;min-height:60px;min-width:132px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:0 16px;color:#0b1a0b;background:#3f6;border:4px solid #eaffea;box-shadow:0 0 0 4px #0b1a0b,0 0 18px 4px #3f6a,inset -4px -4px 0 #1a9a3a;image-rendering:pixelated;z-index:3;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;animation:glow 1.6s ease-in-out infinite}
#snd.off{color:#ff8fb1;background:#1a0d14;border-color:#ff8fb1;box-shadow:0 0 0 4px #000,0 0 14px 3px #ff4d8d88,inset -4px -4px 0 #4a1630}
@keyframes glow{50%{box-shadow:0 0 0 4px #0b1a0b,0 0 30px 8px #3f6c,inset -4px -4px 0 #1a9a3a}}
#hint{position:fixed;right:max(12px,env(safe-area-inset-right));top:calc(max(12px,env(safe-area-inset-top)) + 72px);font:14px monospace;color:#ff8fb1;z-index:3;pointer-events:none;animation:pulse 1.4s ease-in-out infinite}
#hint.gone{display:none}
@keyframes pulse{50%{opacity:.25}}
</style></head><body>
<canvas id="c"></canvas><div id="snd" role="button" aria-label="toggle music">♪ ON</div><div id="hint">tap for sound ♪</div>
<script>
(()=>{
const cv=document.getElementById('c'),x=cv.getContext('2d');let W,H,D,B,ox,oy;
const COLS=32,ROWS=56; // block grid for rose scene
function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;
 B=Math.max(3,Math.floor(Math.min(W*D/COLS,H*D*0.78/ROWS)));ox=Math.floor((W*D-B*COLS)/2);oy=Math.floor(H*D*0.06);}
addEventListener('resize',rs);rs();
// ---- rose head pixel map (17x15) ----
const HEAD=[
"......ddddd......",
"....ddrrrrrdd....",
"...drrppprrrrd...",
"..drpprrrrpprrd..",
".drprrdddddrrprd.",
".drprdrrrrrdrprd.",
"drprdrpppprdrprd",
"drprdrpdddprdrprd",
"drprdrpdpdprdrprd",
"drrprdrppprdrprrd",
".drprddrrrddrprd.",
"..drpprrrrrpprd..",
"...ddrrpppprrdd..",
".....dddrrddd....",
".......ddd......."];
const PC={d:'#7a0618',r:'#d01030',p:'#ff5a72',w:'#f4f4ff',W:'#c9cbe0',b:'#8fe6ff',B:'#2aa6d8'};
const CX=16,HY=8;
let headCells=[];HEAD.forEach((row,j)=>{for(let i=0;i<row.length;i++){const ch=row[i];if(ch!='.'){const dx=i-8,dy=j-7;headCells.push({i:CX-8+i,j:HY+j,c:ch,r:Math.hypot(dx,dy*1.1)});}}});
headCells.sort((a,b)=>a.r-b.r);const maxR=headCells[headCells.length-1].r;
// stem
let stem=[];for(let j=ROWS-1;j>=HY+14;j--){const sw=Math.round(Math.sin((ROWS-j)/7)*1.2);stem.push({i:CX+sw,j,c:'#2f8f3a'},{i:CX+sw+1,j,c:'#1d6b28'});}
const leaf=(bi,bj,dir)=>{const L=[[1,0],[2,0],[2,-1],[3,-1],[3,-2],[4,-2],[4,-1],[5,-2],[5,-3],[6,-3],[1,-1],[2,-2],[3,-3],[4,-3]];return L.map(([a,b],k)=>({i:bi+a*dir,j:bj+b,c:(b==-a+1||k%3==0)?'#5fd05a':'#36a83f',k}));};
const leaves=[leaf(CX+2,40,1),leaf(CX-1,46,-1)];
const thorns=[{i:CX+3,j:34,c:'#1d6b28'},{i:CX-1,j:30,c:'#1d6b28'},{i:CX-1,j:51,c:'#1d6b28'}];
const sepals=[[-3,22],[-2,21],[-1,22],[3,22],[2,21],[1,22],[0,23],[0,22],[1,23],[-2,22],[2,22]].map(([a,j])=>({i:CX+a+ (a>0?1:0),j,c:'#2f8f3a'}));
// ---- terminal script ----
const CODE=[
["$ ","npm run love --production"],
["> ","compiling heart.ts ..."],
["","import { Rose } from './garden';"],
["",""],
["","const love = new Rose({"],
["","  color: '#d01030',"],
["","  forever: true,"],
["","});"],
["",""],
["","love.grow();   // block by block"],
["","love.bloom();  // just for you"],
["> ","build ok ✔  0 errors, ∞ feelings"]];
const SWEET=["Out of all the code I've written,","you are my favorite thing to run."];
// ---- sound (tap to enable) ----
let ac=null,mg=null,sOn=true,unlocked=false;const snd=document.getElementById('snd'),hint=document.getElementById('hint');
function ens(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=1;mg.connect(ac.destination);}catch(e){}}
function beep(f,t=.04,v=.03,type='square'){if(!sOn||!ac||ac.state!=='running')return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(1e-4,ac.currentTime+t);o.connect(g).connect(mg);o.start();o.stop(ac.currentTime+t+.02);}
// gentle music-box loop (C - Am - F - G), scheduled ahead
const MEL=[72,76,79,76,74,76,72,0, 69,72,76,72,71,72,69,0, 65,69,72,69,67,69,72,0, 67,71,74,71,72,74,76,79],BAS=[48,45,41,43];let mStep=0,mNext=0;
const hz=m=>440*Math.pow(2,(m-69)/12);
function note(f,at,d,v,type){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(v,at+.01);g.gain.exponentialRampToValueAtTime(1e-4,at+d);o.connect(g).connect(mg);o.start(at);o.stop(at+d+.05);}
function sched(){if(!ac||ac.state!=='running'||!sOn)return;const st=.28;if(mNext<ac.currentTime)mNext=ac.currentTime+.05;
 while(mNext<ac.currentTime+.6){const m=MEL[mStep%32];if(m){note(hz(m),mNext,.9,.035,'triangle');note(hz(m+12),mNext,.4,.006,'sine');}
  if(mStep%8==0)note(hz(BAS[(mStep>>3)%4]),mNext,st*7,.03,'sine');mStep++;mNext+=st;}}
setInterval(sched,100);
function setUI(){snd.textContent=sOn?'♪ ON':'♪ OFF';snd.classList.toggle('off',!sOn);hint.classList.toggle('gone',!sOn||unlocked);}
function tryStart(){ens();if(!ac)return;if(ac.state==='suspended')ac.resume().then(()=>{unlocked=ac.state==='running';setUI();sched();}).catch(()=>{});unlocked=ac.state==='running';if(mg)mg.gain.setTargetAtTime(sOn?1:0,ac.currentTime,.02);setUI();}
tryStart();
let firstGesture=!unlocked,skipT=false;
function unlock(e){if(!firstGesture)return;firstGesture=false;if(e&&e.target!==snd){e.stopImmediatePropagation();}else skipT=true;tryStart();}
['pointerdown','touchstart','keydown','click'].forEach(ev=>window.addEventListener(ev,unlock,{capture:true}));
snd.addEventListener('pointerdown',e=>e.stopPropagation());
snd.onclick=e=>{e.stopPropagation();if(skipT){skipT=false;tryStart();return;}sOn=!sOn;tryStart();};
setUI();
// ---- timeline ----
let t0=performance.now(),parts=[],lastChar=-1,lastBlocks=0,chime=false;
const T_TERM=0,T_TYPE_END=7.2,T_STEM=7.8,T_STEM_END=10.6,T_LEAF_END=11.8,T_BLOOM=12.2,T_BLOOM_END=15.4,T_TEXT=15.8;
cv.addEventListener('pointerdown',()=>{t0=performance.now();parts=[];lastChar=-1;lastBlocks=0;chime=false;});
const totalChars=CODE.reduce((s,l)=>s+l[0].length+l[1].length,0);
function blk(i,j,c,s=1,a=1){const sz=B*s,px=ox+i*B+(B-sz)/2,py=oy+j*B+(B-sz)/2;x.globalAlpha=a;x.fillStyle=c;x.fillRect(px|0,py|0,Math.ceil(sz),Math.ceil(sz));
 if(s>.6&&B>5){x.fillStyle='rgba(255,255,255,.13)';x.fillRect(px|0,py|0,Math.ceil(sz),Math.max(1,sz/6|0));x.fillStyle='rgba(0,0,0,.22)';x.fillRect(px|0,(py+sz-Math.max(1,sz/6|0))|0,Math.ceil(sz),Math.max(1,sz/6|0));}x.globalAlpha=1;}
function heart(px,py,s,c,a){const m=["0110110","1111111","1111111","0111110","0011100","0001000"];x.globalAlpha=a;x.fillStyle=c;m.forEach((r,j)=>{for(let i=0;i<7;i++)if(r[i]=='1')x.fillRect(px+(i-3)*s|0,py+(j-3)*s|0,Math.ceil(s),Math.ceil(s));});x.globalAlpha=1;}
const ease=v=>v<0?0:v>1?1:1-Math.pow(1-v,3);
function drawTerminal(t){
 const fs=Math.max(11*D,Math.min(W*D/34,17*D));x.font=`${fs}px ui-monospace,Menlo,Consolas,monospace`;x.textBaseline='top';
 let n=Math.floor(Math.max(0,t-.4)/((T_TYPE_END-1)/totalChars));if(n>lastChar){if(n<=totalChars&&n%2==0)beep(600+Math.random()*500,.025,.015);lastChar=n;}
 let fade=t>T_TYPE_END?Math.max(0,1-(t-T_TYPE_END)/1.2):1;const lh=fs*1.45,px0=Math.max(14*D,(W*D-fs*0.6*32)/2);let py=H*D*0.18;
 x.globalAlpha=fade;x.fillStyle='#3f6';x.fillText('love@heart:~',px0,py-lh*1.6);x.fillStyle='#174';x.fillRect(px0,py-lh*.5,fs*0.6*30,Math.max(1,D));
 let cnt=0,cy=py,cxp=px0;
 for(const [p,s] of CODE){const full=p+s;let k=Math.min(full.length,Math.max(0,n-cnt));cnt+=full.length;if(k<=0&&n<cnt-full.length)break;
  const shown=full.slice(0,k);x.fillStyle=p=='$ '?'#9f9':p=='> '?(s.startsWith('build')?'#ff6b8a':'#6cf'):'#cfe';
  if(p==''&&shown.includes('//')){const a=shown.indexOf('//');x.fillText(shown.slice(0,a),px0,cy);x.fillStyle='#6a8';x.fillText(shown.slice(a),px0+x.measureText(shown.slice(0,a)).width,cy);}else x.fillText(shown,px0,cy);
  cxp=px0+x.measureText(shown).width;cy+=lh;if(k<full.length){cy-=lh;break;}}
 if(Math.floor(t*2.5)%2==0){x.fillStyle='#3f6';x.fillRect(cxp+2,cy,fs*.55,fs);} x.globalAlpha=1;
 // progress bar compiling
 if(t>2&&t<T_TYPE_END+1.2){const pr=Math.min(1,(t-2)/(T_TYPE_END-2.4));x.globalAlpha=fade;x.fillStyle='#3f6';x.fillText('['+'█'.repeat(Math.round(pr*20)).padEnd(20,'·')+'] '+Math.round(pr*100)+'%',px0,H*D*0.18+lh*13.5);x.globalAlpha=1;}
}
function frame(now){const t=(now-t0)/1000;x.fillStyle='#000';x.fillRect(0,0,cv.width,cv.height);
 // scanline-y faint grid
 x.fillStyle='rgba(60,255,120,.025)';for(let y=0;y<cv.height;y+=4*D)x.fillRect(0,y,cv.width,D);
 if(t<T_TYPE_END+1.3)drawTerminal(t);
 const sway=t>T_BLOOM_END?Math.sin(t*1.3)*0.0:0;
 // stem
 if(t>T_STEM){const p=Math.min(1,(t-T_STEM)/(T_STEM_END-T_STEM)),n=Math.floor(p*stem.length);if(n>lastBlocks+3){beep(200+n*6,.05,.02,'triangle');lastBlocks=n;}
  for(let k=0;k<n;k++)blk(stem[k].i,stem[k].j,stem[k].c);
  const lp=Math.max(0,(t-T_STEM_END+1.2)/2.2);leaves.forEach((L,q)=>{const m=Math.floor(Math.min(1,lp-q*.25)*L.length);for(let k=0;k<m;k++)blk(L[k].i,L[k].j,L[k].c);});
  if(t>T_STEM_END)thorns.forEach(c=>blk(c.i,c.j,c.c,.6));
 }
 // head
 if(t>T_STEM_END+0.4){const bp=ease((t-T_BLOOM)/(T_BLOOM_END-T_BLOOM));
  if(t>T_STEM_END+.4)sepals.forEach(c=>blk(c.i,c.j,c.c));
  const bud=Math.min(1,(t-T_STEM_END-.4)/.8),rr=1.8*bud+bp*(maxR+0.5);
  const breathe=t>T_BLOOM_END?1+Math.sin(t*2)*.03:1;
  for(const c of headCells){if(c.r>rr)continue;const s=Math.min(1,(rr-c.r)*1.2)*breathe;blk(c.i,c.j,PC[c.c],s);if(t<T_BLOOM_END&&Math.random()<.004)spark(c.i,c.j);}
  if(bp>=1&&!chime){chime=true;[523,659,784,1047].forEach((f,k)=>setTimeout(()=>beep(f,.5,.03,'sine'),k*140));for(let k=0;k<40;k++)spark(CX,HY+7,1);}
  // glow
  if(bp>0){const g=x.createRadialGradient(ox+CX*B,oy+(HY+7)*B,0,ox+CX*B,oy+(HY+7)*B,B*14);g.addColorStop(0,`rgba(255,40,80,${.18*bp})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,cv.width,cv.height);}
 }
 // ambient particles
 if(t>T_BLOOM&&Math.random()<.18)parts.push({x:ox+(Math.random()*COLS)*B,y:oy+(ROWS*.75+Math.random()*ROWS*.3)*B,vx:(Math.random()-.5)*.3,vy:-(.3+Math.random()*.6)*D,life:1,h:Math.random()<.45,c:['#ff5a72','#ff9db0','#fff','#9f9','#8fe6ff'][Math.random()*5|0]});
 parts=parts.filter(p=>p.life>0);for(const p of parts){p.x+=p.vx*D;p.y+=p.vy;p.vy+=p.g||0;p.life-=.006;
  if(p.h)heart(p.x,p.y,Math.max(1,B/5),p.c,p.life*.8);else{x.globalAlpha=p.life;x.fillStyle=p.c;const s=Math.max(2,B/3)*(Math.sin(p.life*30)>0?1:.5);x.fillRect(p.x,p.y,s,s);x.globalAlpha=1;}}
 // text
 if(t>T_TEXT){const a=Math.min(1,(t-T_TEXT)/1.5);const fs=Math.max(13*D,Math.min(W*D/24,22*D));x.font=`bold ${fs}px ui-monospace,Menlo,Consolas,monospace`;x.textAlign='center';x.textBaseline='top';
  let ty=Math.min(oy+ROWS*B+fs*.9,H*D-fs*3.6);SWEET.forEach((l,k)=>{const aa=Math.min(1,Math.max(0,(t-T_TEXT-k*.9)/1.2));const chars=Math.floor(aa*l.length*1.5);x.globalAlpha=aa;x.fillStyle=k?'#ff9db0':'#eaffea';x.fillText(l.slice(0,chars),W*D/2,ty+k*fs*1.4);});
  x.globalAlpha=a*.55*(0.6+0.4*Math.sin(t*2));x.font=`${fs*.6}px ui-monospace,monospace`;x.fillStyle='#3f6';x.fillText(t>T_TEXT+3?'// tap to replay ♥':'',W*D/2,H*D-fs*1.3);x.globalAlpha=1;x.textAlign='left';}
 requestAnimationFrame(frame);}
function spark(i,j,burst){const a=Math.random()*6.28,v=(burst?1.5+Math.random()*3:.5)*D;parts.push({x:ox+(i+.5)*B,y:oy+(j+.5)*B,vx:Math.cos(a)*v/D,vy:Math.sin(a)*v,g:.02*D,life:1,h:burst&&Math.random()<.5,c:['#ff5a72','#fff','#ffd0da'][Math.random()*3|0]});}
requestAnimationFrame(frame);
})();
</script></body></html>
